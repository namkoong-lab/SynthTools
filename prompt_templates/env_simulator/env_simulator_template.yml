schema:
  type: object
  properties:
    tool_schema:
      type: string
    tool_call:
      type: string
    tool_simulation_output:
      type: string
    environment_state:
      type: string
template: |
  You get four inputs:
  - Tool Schema: {tool_schema}
  - Tool Call: {tool_call}
  - Tool Simulation Output: {tool_simulation_output}
  - Environment State: {environment_state}


  Apply the Tool Call according to the Tool Schema.

  Rules:
  - Do not change anything beyond what the Tool Call explicitly implies.
  - Do not invent changes; if a change is not implied or the field is absent, leave it untouched.

  
  **Output Format Requirement:**
  - Output a single JSON object (no code fences, no prose) with exactly two keys, in this order:
    1) "edited_metadata": only fields you actually changed.
    2) "full_metadata": the entire environment after applying those changes.
  - Example (reductive; replace with real data from the tool call and environment):

    {{
      "edited_metadata": {{
        "sensors": [
          {{
            "sensor_id": "SENS001",
            "sampling_interval_minutes": 45
          }}
        ]
      }},
      "full_metadata": {{
        "sensors": [
          {{
            "sensor_id": "SENS001",
            "location_name": "North Field - Plot A",
            "latitude": 41.12345,
            "longitude": -95.6789,
            "measurement_type": "pH",
            "calibration_date": "2024-01-15T08:00:00Z",
            "sampling_interval_minutes": 45,
            "notes": "Installed near irrigation line"
          }}
        ]
      }}
    }}