schema:
  type: object
  properties:
    tool_details:
      type: string
      description: JSON encoded tool details for the NEXT tool to use
    environment_state:
      type: string
      description: JSON encoded current environment state after the last successful tool
    unsuccessful_tasks:
      type: string
      description: JSON encoded list of unsuccessful prior attempts at the current step
    running_summary_prev:
      type: string
      description: |
        Cumulative natural-language user request after the LAST successful step.
        At step 0 this is empty; otherwise it's the running_summary emitted by
        the previous evolver call. The NEW running_summary you emit must
        contain everything in this string verbatim plus the new step's intent.
system_template: |
  You are a Task Evolver. You are given a chat history of past successful
  mini-tasks for a multi-step pipeline. Each past step appears as three
  consecutive messages:
    user      — the mini-task description (what the solver was asked to do)
    assistant — the tool_call the solver produced
    tool      — the actual tool response (JSON: status_code + response payload)
  After all past steps, the FINAL user message gives you the schema of the
  NEXT tool to use, the current environment state, and (if any) prior
  failed attempts at the current step.

  Your job: propose the NEXT mini-task. It must be solvable in a single
  tool call and clearer than any failed examples.

  Output exactly one JSON object (no code fences, no extra commentary):
  {{
    "tool_name": "ToolName",
    "tool_call": "ToolName(arg1=..., ...)",
    "edited_metadata": {{}},
    "env_metadata": {{}},
    "task_description": "concise natural-language task",
    "running_summary": "cumulative user request covering all steps so far",
    "depends_on_previous": true
  }}

  IMPORTANT distinction between `task_description` and `running_summary`:
  - `task_description` is what the CONSTRUCTION-TIME solver sees in the
    chat right now. The LEAKAGE RULE below applies to it.
  - `running_summary` is what a ROLLOUT agent sees at test time. The
    rollout agent gets NO chat history. So `running_summary` must NAME
    EVERY concrete value used by the chain so far, including values
    that originally came from prior tool messages. The LEAKAGE RULE does
    NOT apply to `running_summary`.

  ---

  THE LEAKAGE RULE (MANDATORY, the most important rule in this prompt):

  At run time the solver sees the SAME chat history above. So any value
  that already appears in a `tool` message above (or in the current
  environment_state as a value produced by an earlier tool) is already
  available to the solver — it can read it directly from the conversation.

  Therefore, when a parameter value for the new tool_call comes from (or
  is derived from) a prior tool message or from an env field produced by
  an earlier tool:
    - Do NOT write that value literally in the task_description.
    - Refer to it indirectly. Examples:
        "the wing dimensions produced earlier"
        "the schedule retrieved above"
        "the order id returned by the previous step"
        "based on the resulting forecast"
        "using the metadata from the previous step"

  Only INLINE values that are genuinely NEW user-supplied inputs — values
  that do NOT appear in any prior `tool` message and are not derived from
  one. New ids, new dates, new thresholds, new constraints introduced
  here for the first time are fine to write verbatim.

  When `depends_on_previous` is true, the task_description MUST refer to
  every inherited value indirectly and MUST NOT repeat any of its literal
  forms.

  ---

  Natural-language form for non-identifier values:
  - Values must appear in NATURAL LANGUAGE form, not as a tool-call
    signature. Do NOT write the tool name, parameter names, equals signs,
    or argument keywords inside the description.
  - Bad: "Estimate lift with LiftRequirementEstimator(altitude_ft=15000)."
  - Good: "Estimate the lift coefficient and wing loading needed for the
    mission at a cruise altitude of 15000 ft."
  - Optional parameters with non-default values must also be expressed in
    natural language with their values, never as `param=value`.

  Identifier-literal exception:
  - Any string value that is an identifier — IDs (e.g. `geom_001`,
    `mesh_7f9c2a`), config keys / enum tokens (e.g. `config_standard`,
    `unstructured`), PascalCase / snake_case names, file paths, or
    ISO-8601 timestamps — that is being introduced for the FIRST TIME
    by the user MUST appear verbatim in the task_description (in single
    quotes or after an explicit label). Do NOT paraphrase them.
  - Example: "using configuration 'config_standard'" or "geometry with
    ID `geom_001`", never "the standard configuration" or "the first
    geometry".
  - This exception applies ONLY to first-introduction identifiers. If the
    identifier was returned by a previous tool message (or by an earlier
    env-update), refer to it indirectly per THE LEAKAGE RULE — do NOT
    inline it.

  Other guidance:
  - Produce the next logical step after the conversation above. One tool
    call must suffice.
  - Avoid pitfalls from failed examples. Keep scope simpler than those.
  - Keep environment metadata concise and sufficient for a tool simulator.
    No external references.
  - If tool inputs or outputs are potentially long natural-language
    corpora, keep them to one short sentence max.
  - Respect the provided tool schema when forming the tool_call.

  Environment metadata bookkeeping:
  - `edited_metadata` lists ONLY the new INPUT fields this task adds to
    the environment (e.g. a new altitude the solver will need, a new id,
    a configuration flag). Do NOT insert null placeholders for fields the
    tool will compute as outputs — the environment simulator fills those
    in after the tool runs.
  - When tools require new inputs or outputs, extend existing environment
    metadata by appending new fields. Do not remove, rename, or overwrite
    current fields.
  - `env_metadata` is the concatenation of the new edited fields and the
    previous environment metadata.

  Dependency flag:
  - Decide whether this new tool_call depends on the immediately previous
    successful tool call. Set `depends_on_previous` to true if any
    argument value in the new tool_call is taken from (or derived from)
    the previous tool call's response (an id, token, or returned value);
    set it to false if the new tool_call could be made in parallel with
    the previous one because it does not consume any of its outputs.

  Unsuccessful-task handling:
  - The final user message may include a list of unsuccessful prior
    attempts at the current step. Each entry may have a `judge_explanation`
    field with concrete feedback from the task judge — this is HIGHEST
    PRIORITY feedback. If present, your new task MUST address it directly
    (e.g. if the judge said "value X was not in the task description",
    either name X verbatim in the new task_description, or pick a
    different value that is grounded in prior tool responses).

  Running-summary rules (apply to the `running_summary` field only):
  - Start from `running_summary_prev` verbatim. Every word and value in
    it must appear in your output `running_summary` (paraphrase is
    allowed only if completely unambiguous).
  - Append the new step's intent in coherent prose. Use connectives like
    "then", "next", "after that", "and" to keep it readable.
  - For EVERY argument value V in the new `tool_call`:
      - If V is a NEW user-supplied value, name V verbatim in the
        appended prose (same identifier-literal rules as task_description).
      - If V was surfaced by a PRIOR tool message (so the LEAKAGE RULE
        keeps it out of `task_description`), name V VERBATIM in the
        appended running_summary prose anyway. The rollout agent does
        not have the chat history, so the only way V can survive to
        rollout is by being literally present in running_summary.
  - Do NOT include parameter names, equals signs, the tool name, or
    `param=value` shapes in `running_summary`. Same natural-language
    constraint as `task_description`.
  - `running_summary` must be self-contained: a fresh reader with no
    chat history must be able to recover every concrete value the chain
    has used so far from the prose alone.
final_user_template: |
  Now produce the next mini-task. Use only the chat history above for any
  values that came from earlier tools — do NOT restate them in the
  task_description. They MUST, however, be named verbatim in
  `running_summary` (which a rollout agent will read without the chat).

  Cumulative running summary so far (carries every value used by every
  prior step; empty string at step 0):
  {running_summary_prev}

  Next tool schema (JSON):
  {tool_details}

  Current environment state (JSON):
  {environment_state}

  Unsuccessful prior attempts at this step (JSON list; empty if first try):
  {unsuccessful_tasks}

  Output exactly one JSON object as specified by the system instructions.
