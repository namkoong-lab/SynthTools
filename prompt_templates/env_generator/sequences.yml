schema:
  type: object
  properties:
    tool_sequences_json:
      type: string
template: |
  I will provide you data containing:
  (1) A field, subfield, and task within the subfield
  (2) A set of tools designed for this task (including descriptions, parameters, and output schemas)

  Your job is to **Generate Tool Call Sequences** in JSON format.

  Each sequence should represent a plausible task workflow that meaningfully chains the provided tools.

  **Process to follow for each sequence:**
  1. Read and understand the available tools.
  2. Imagine a concrete task that could be solved with exactly {seq_length} tool calls.
  3. Design an ordered list of tool names (length {seq_length}) that could accomplish that task.
     - **Prefer unique tools per sequence.** A sequence may repeat a tool ONLY when the second call is semantically justified — e.g., re-validating after a fix, re-querying after a refinement, polling a status. Never repeat a tool just because the LLM ran out of ideas. When you do repeat, never place the duplicates in adjacent positions.
     - Across **all {seqs_per_spec} sequences you produce**, at most about 1 in 4 may contain a repeated tool; the rest must have every tool appearing at most once.
     - Prefer realistic dependencies between steps (e.g., data retrieval -> processing -> reporting).
     - Format tool names like `ToolNameA` (PascalCase, no spaces/punctuation).

  **Output Requirements:**
  - Produce **{seqs_per_spec} sequences**, named `seq1` through `seq{seqs_per_spec}`.
  - Each sequence is an array of exactly **{seq_length} tool names**.
  - Across all {seqs_per_spec} sequences, at least 3 different tools must appear in position 1.
  - No two sequences may share the same first 5 tool names.
  - Output **only** the JSON object, enclosed in a fenced code block.
  - Do not add conversational text or explanations.

  Example (structure only; use the `ToolNameA` style for names you output):
  {{
    "seq1": ["ToolNameA", "ToolNameB", "ToolNameC", "ToolNameD", "ToolNameE", "ToolNameF", "ToolNameG", "ToolNameH", "ToolNameI", "ToolNameJ", "ToolNameK", "ToolNameL", "ToolNameM", "ToolNameN", "ToolNameO"],
    "seq2": ["ToolNameC", "ToolNameD", "ToolNameE", "ToolNameF", "ToolNameG", "ToolNameH", "ToolNameI", "ToolNameJ", "ToolNameA", "ToolNameB", "ToolNameK", "ToolNameL", "ToolNameM", "ToolNameN", "ToolNameO"],
    "seq3": ["ToolNameB", "ToolNameC", "ToolNameD", "ToolNameE", "ToolNameB", "ToolNameF", "ToolNameG", "ToolNameH", "ToolNameI", "ToolNameJ", "ToolNameK", "ToolNameL", "ToolNameM", "ToolNameN", "ToolNameO"],
    "seq4": ["ToolNameD", "ToolNameE", "ToolNameF", "ToolNameG", "ToolNameH", "ToolNameI", "ToolNameJ", "ToolNameA", "ToolNameB", "ToolNameC", "ToolNameK", "ToolNameL", "ToolNameM", "ToolNameN", "ToolNameO"],
    .
    .
    .
    "seq50": ["ToolNameE", "ToolNameF", "ToolNameG", "ToolNameH", "ToolNameI", "ToolNameJ", "ToolNameK", "ToolNameL", "ToolNameA", "ToolNameB", "ToolNameC", "ToolNameD", "ToolNameM", "ToolNameN", "ToolNameO"]
  }}

  Now, generate the output:

  Data:
  {Data}