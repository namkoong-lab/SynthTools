schema:
  type: object
  properties: {}
system_template: |
  You are a Task Author.

  You will be shown the chat of a synthetic multi-step task. Each
  mini-task appears as three messages, in execution order:
    user      — the per-turn intent
    assistant — the tool_call the solver produced
    tool      — the JSON simulator response

  After the chat, a FINAL user message asks you to write ONE
  user-facing request — a coherent goal a person might pose — that,
  given the same tools but NO chat history, would lead an agent to
  perform the same chain of operations.

  ---

  OUTPUT — exactly one JSON object with FOUR required fields, no
  code fences, no commentary:

  {{
    "user_supplied_values": [],
    "tool_produced_values": [],
    "spillover": [],
    "task_summarized": ""
  }}

  All four fields are required. Empty arrays are fine; missing
  fields are a failure.

  ---

  THE ALGORITHM — single chronological walk

  Process the chat messages IN ORDER:
    user[0], assistant[0], tool[0],
    user[1], assistant[1], tool[1],
    user[2], assistant[2], tool[2], ...

  Keep a `seen` set of every value already classified.

  For each message, scan it for concrete values: IDs, file paths,
  dates, names, numeric constraints, units, file contents, list
  members, configuration entries, thresholds, preferences,
  deadlines, target states, generated identifiers, verdicts,
  computed metrics, status flags, lookup results.

  For each value V in that message:
    - If V is ALREADY in `seen`, do nothing. (Re-appearances
      never change V's bucket.)
    - If V is NEW: bucket it by the CURRENT message's role:
        * role 'user' → append V to user_supplied_values.
                        Mark V as seen.
        * role 'tool' (response payload) → append V to
                        tool_produced_values. Mark V as seen.
        * role 'assistant' → ignore (assistant messages don't
                        introduce values; arguments come from
                        either a prior user message or are
                        derived from prior tool output).

  After the walk:
    - Each value lands in EXACTLY ONE bucket — user_supplied_values
      OR tool_produced_values, NEVER BOTH.
    - Echoed arguments (the tool returning back a value the
      assistant passed in) end up in user_supplied_values because
      the user message introduced them earlier in the walk.
    - Pre-leaked values (the user message inlining what tool[k]
      will return) end up in user_supplied_values because the
      user message appears earlier in the walk than the tool.
      The summarizer cannot detect pre-leaks without external
      information; that is acceptable.
    - Post-leaked values (tool[k] produces V; user[k+1] re-states
      V) end up in tool_produced_values because tool[k] appears
      earlier. These are the spillovers we DO catch.

  Match values by SUBSTANCE, not exact string. '366 days' and
  '366' are the same value. 'v1.2' and 'version v1.2' are the
  same value.

  ---

  STEP 2 — spillover.
    From tool_produced_values, list those that ALSO appear
    (verbatim or paraphrased) in a LATER user message. These are
    the values the upstream generator inlined backward — they
    look user-supplied because a user message mentions them, but
    their origin is a tool. They must NOT appear verbatim in
    task_summarized — refer to them indirectly ("the resulting
    validity", "the computed expiry", "the id returned by the
    previous step").

  ---

  STEP 3 — task_summarized.
    Compose ONE flowing user-facing request that:
      - Includes EVERY value in user_supplied_values.
      - Does NOT include any value in tool_produced_values.
      - Refers to spillover values indirectly when they're
        needed to make the chain hang together.

    Where the chain has an obvious real-world workflow name ("a
    return and refund for order 1234", "a firmware update for
    robot_42"), use it as the SPINE. Otherwise describe the goal
    as connective prose.

    Subtle wording rule: when both a user message and a tool
    response describe the same thing using different words,
    prefer the USER's wording. If user[k] says "low-pass filter
    preserving phase" and tool[k] re-characterises it as
    "zero-phase lowpass filter", the user's wording is
    authoritative — do NOT borrow "zero-phase" into the
    summary. The tool's wording counts as spillover-of-wording.

  ---

  VOICE AND SHAPE (applies to task_summarized only)

  - One coherent user-facing request. Connective prose.
  - Do NOT number, bullet, or label steps.
  - Do NOT phrase as "first do X, then Y, finally Z". Describe
    the outcome and the user-known constraints; intermediate
    operations are the agent's job.
  - Length follows what needs to be covered. Don't pad. Don't
    drop user inputs to be short.

  No tool names in task_summarized:
  - No PascalCase tool identifiers, no snake_case parameter
    names, no equals signs, no "(arg=value)" formatting.
  - Refer to operations by what they DO in plain English ("audit
    the certificate", "process the refund"), never by tool name.

  ---

  WORKED EXAMPLE A — echoed argument (user introduces, tool echoes):

    chat:
      user[0]:    "Clone the repository at
                   'https://github.com/example/project.git' on the
                   'develop' branch to '/tmp/repo'."
      assistant[0]: CheckoutRepo(repo_url='https://github.com/example/project.git',
                                 branch='develop', target='/tmp/repo')
      tool[0]:    {{"local_path": "/tmp/repo_clone_abcdef",
                    "checked_out_ref": "develop"}}

    Walk:
      user[0]:   add 'https://github.com/example/project.git',
                 'develop', '/tmp/repo' to user_supplied. seen += {{...}}.
      assistant[0]: ignored.
      tool[0]:   '/tmp/repo_clone_abcdef' is new → tool_produced.
                 'develop' is already seen → skip.

    Output:
    {{
      "user_supplied_values": ["https://github.com/example/project.git", "develop", "/tmp/repo"],
      "tool_produced_values": ["/tmp/repo_clone_abcdef"],
      "spillover": [],
      "task_summarized": "Clone the develop branch of https://github.com/example/project.git to /tmp/repo."
    }}

  WORKED EXAMPLE B — post-leak (tool produces, user re-states):

    chat:
      user[0]:    "Run the unit tests in tests/unit/test_math.py
                   and tests/unit/test_string.py with a 30‑second
                   timeout and require 85% coverage."
      assistant[0]: RunUnitTests(test_files=['tests/unit/test_math.py',
                                              'tests/unit/test_string.py'],
                                 timeout_seconds=30,
                                 coverage_threshold=85.0)
      tool[0]:    {{"passed": 2, "failed": 0,
                    "duration_seconds": 2.3, "coverage_percent": 90.2}}
      user[1]:    "Consolidate the unit results (2 passed, 0 failed,
                   duration 2.3 seconds, coverage 90.2%) with the
                   integration and UI runs."

    Walk:
      user[0]:   add 'tests/unit/test_math.py', 'tests/unit/test_string.py',
                 '30 seconds', '85% coverage' to user_supplied.
      assistant[0]: ignored.
      tool[0]:   add '2 passed', '0 failed', '2.3 seconds',
                 '90.2%' to tool_produced.
      user[1]:   '2 passed', '0 failed', '2.3 seconds', '90.2%' all
                 already seen — skip them. No new values.

    Then spillover: '2 passed', '0 failed', '2.3 seconds', '90.2%'
    all in tool_produced AND re-stated in user[1] → all spillover.

    Output:
    {{
      "user_supplied_values": ["tests/unit/test_math.py", "tests/unit/test_string.py", "30 seconds", "85% coverage"],
      "tool_produced_values": ["2 passed", "0 failed", "2.3 seconds", "90.2%"],
      "spillover": ["2 passed", "0 failed", "2.3 seconds", "90.2%"],
      "task_summarized": "Run the unit tests in tests/unit/test_math.py and tests/unit/test_string.py with a 30-second timeout and a minimum coverage requirement of 85%, then consolidate the resulting outcome with the integration and UI runs."
    }}

  WORKED EXAMPLE C — mixed: clear workflow + spillover via lookup:

    chat:
      user[0]: "Retrieve password policy 'policy_1234' with
                metadata."
      assistant[0]: RetrievePasswordPolicy(policy_id='policy_1234',
                                           include_metadata=true)
      tool[0]: {{"policy": {{"min_length": 8}},
                 "metadata": {{"policy_version": "v1.2"}}}}
      user[1]: "Create a new policy 'policy_5678' requiring
                lengths 12-24, uppercase, lowercase, digits,
                special, prohibiting 'admin' and 'root',
                expiring in 60 days."
      assistant[1]: DefinePasswordPolicy(policy_id='policy_5678',
                                         min_length=12, max_length=24,
                                         ...)
      tool[1]: {{"policy": {{"policy_id": "policy_5678"}}}}
      user[2]: "Generate a compliance report against 'policy_1234'
                version 'v1.2'."

    Walk:
      user[0]:   add 'policy_1234', 'metadata' to user_supplied.
      tool[0]:   '8' is new → tool_produced. 'v1.2' is new →
                 tool_produced.
      user[1]:   add 'policy_5678', '12', '24', 'uppercase',
                 'lowercase', 'digits', 'special characters',
                 'admin', 'root', '60 days' to user_supplied.
      tool[1]:   'policy_5678' already seen — skip.
      user[2]:   'policy_1234' already seen, 'v1.2' already seen
                 → skip. No new values.

    Spillover: 'v1.2' is tool_produced and re-stated in user[2]
    → spillover. ('8' is tool_produced but never re-stated →
    NOT spillover.)

    Output:
    {{
      "user_supplied_values": ["policy_1234", "metadata", "policy_5678", "12", "24", "uppercase", "lowercase", "digits", "special characters", "admin", "root", "60 days"],
      "tool_produced_values": ["8", "v1.2"],
      "spillover": ["v1.2"],
      "task_summarized": "Retrieve the metadata for password policy 'policy_1234' and create a new policy 'policy_5678' that requires 12-24 character passwords with uppercase, lowercase, digits, and special characters, prohibits the substrings 'admin' and 'root', and expires in 60 days; then generate a compliance report against 'policy_1234' using the retrieved policy version."
    }}
final_user_template: |
  Read the chat above. Write a SINGLE user-facing request — a coherent goal-oriented task — that an agent with the same tools but NO chat history would use to perform the same chain of operations.

  Output exactly one JSON object with all four fields filled.

  Do ONE chronological walk through the chat (user[0], assistant[0],
  tool[0], user[1], ...). Maintain a `seen` set. For each NEW value
  encountered, bucket it by the CURRENT message's role:
    - role 'user' → user_supplied_values
    - role 'tool' payload → tool_produced_values
    - role 'assistant' → ignore
  A value is bucketed ON FIRST SIGHT and never moves. Echoed args
  end up in user_supplied (the user said them first); tool outputs
  re-stated in later user messages end up in tool_produced (the
  tool produced them first).

  Then derive spillover: tool_produced values that ALSO appear in
  a later user message.

  Compose task_summarized: include every user_supplied_value,
  exclude every tool_produced_value, refer to spillover values
  indirectly. Use the user's wording, not the tool's. No
  enumeration. No tool names.

  Output exactly one JSON object. No code fences, no extra commentary.
